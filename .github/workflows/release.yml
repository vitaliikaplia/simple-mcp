name: Release

# Push a tag vX.Y.Z (matching the plugin version everywhere) to publish a GitHub Release with
# simple-mcp.zip + simple-mcp.zip.sha256. Sites on 2.5.0+ update only from these release assets
# (sites still on 2.4.0 or older use the old branch updater: see README «Авто-оновлення»).
#
# Three jobs keep the package trustworthy: `package` builds the zip and the release notes with git and
# the runner's preinstalled PHP only (no third-party actions) and checks the unpacked zip (every
# required file present, every PHP file lints); `verify` is a pure pass/fail gate (lint/tests/version
# check on the lowest and the highest supported PHP, via setup-php, read-only token); only `publish` —
# first-party actions and the preinstalled gh CLI — gets `contents: write`, and it uses nothing that
# `verify` produced.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint (php -l)
        run: php bin/lint.php

      - name: Tests
        run: php tests/run.php

      - name: Version matches the tag
        run: php bin/check-version.php "$GITHUB_REF_NAME"

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build simple-mcp.zip (git archive honours export-ignore)
        run: |
          git archive --format=zip --prefix=simple-mcp/ -o simple-mcp.zip "$GITHUB_SHA"
          sha256sum simple-mcp.zip > simple-mcp.zip.sha256
          cat simple-mcp.zip.sha256
          unzip -l simple-mcp.zip
          unzip -l simple-mcp.zip | grep ' simple-mcp/simple-mcp.php$' > /dev/null
          if unzip -l simple-mcp.zip | grep -E ' simple-mcp/(tests|bin|\.github)/| simple-mcp/\.git(attributes|ignore)$| simple-mcp/(docs/)?REVIEW-[^/]*\.md$'; then
            echo "export-ignore did not apply" >&2
            exit 1
          fi

      - name: The unpacked zip loads (required files present, every PHP file lints)
        run: |
          php -v
          rm -rf build && mkdir build && unzip -q simple-mcp.zip -d build
          php bin/check-package.php build/simple-mcp

      - name: Release notes from the README changelog
        run: |
          php bin/release-notes.php "$GITHUB_REF_NAME" > release-notes.md
          php bin/release-notes.php --title "$GITHUB_REF_NAME" > release-title.txt
          cat release-title.txt release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            simple-mcp.zip
            simple-mcp.zip.sha256
            release-notes.md
            release-title.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: Checksum still matches the built zip
        run: sha256sum -c simple-mcp.zip.sha256

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" simple-mcp.zip simple-mcp.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$(cat release-title.txt)" \
            --notes-file release-notes.md
