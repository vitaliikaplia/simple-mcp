name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint (php -l)
        run: php bin/lint.php

      - name: Tests
        run: php tests/run.php

      - name: Version consistency
        run: php bin/check-version.php

  # A real WordPress on the lowest and the highest supported PHP: the endpoint over HTTP, the typed tools on a
  # throwaway post, media upload and wp_cli; any PHP warning/notice/deprecation from the plugin's files fails it.
  wordpress:
    name: WordPress smoke (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, curl
          coverage: none
          tools: wp-cli

      - name: Install WordPress with the plugin
        run: |
          WP_DIR="$RUNNER_TEMP/wordpress"
          wp core download --path="$WP_DIR" --quiet
          wp config create --path="$WP_DIR" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp config set SIMPLE_MCP_ALLOW_INSECURE true --raw --path="$WP_DIR"
          wp config set WP_DEBUG true --raw --path="$WP_DIR"
          wp config set WP_DEBUG_LOG true --raw --path="$WP_DIR"
          wp config set WP_DEBUG_DISPLAY false --raw --path="$WP_DIR"
          wp core install --path="$WP_DIR" --url=http://127.0.0.1:8089 --title="Simple MCP CI" \
            --admin_user=ci --admin_password="$(openssl rand -hex 16)" --admin_email=ci@example.com --skip-email
          wp rewrite structure '/%postname%/' --path="$WP_DIR"
          ln -s "$GITHUB_WORKSPACE" "$WP_DIR/wp-content/plugins/simple-mcp"
          wp plugin activate simple-mcp --path="$WP_DIR"
          echo "WordPress $(wp core version --path="$WP_DIR"), $(php -r 'echo PHP_VERSION;')"

      - name: Smoke test over HTTP
        run: bash tests/e2e/run.sh "$RUNNER_TEMP/wordpress" 8089

  # Below the minimum the plugin must show an admin notice instead of a fatal error.
  old-php:
    name: PHP ${{ matrix.php }} (below the minimum)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: The plugin bails out cleanly
        run: php tests/old-php-guard.php
